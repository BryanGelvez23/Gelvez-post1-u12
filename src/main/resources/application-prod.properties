spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidosdb}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.tienda.pedidos=INFO

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized